# Frontend nginx configuration (Step 16) — same-origin API proxy so the
# browser only ever talks to one origin. No secrets belong in this file.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy — VITE_API_BASE_URL stays empty (same origin).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    # Static assets never carry cache-stale HTML.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
